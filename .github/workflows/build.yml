name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: Java 17 Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle Wrapper Kur ve APK Derle
      run: |
        gradle wrapper --gradle-version 8.6
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m" --stacktrace

    - name: APK'yı Çıktı Olarak Yükle
      uses: actions/upload-artifact@v4
      with:
        name: SesliAsistan-Uygulamasi
        path: app/build/outputs/apk/debug/app-debug.apk
